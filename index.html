<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeoulCards · Lexique coréen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f1e0;--surface:#fffdf7;--surface2:#f2e7c9;--line:#e2cf9c;--text:#2b2420;--dim:#6f6248;--red:#c62828;--gold:#e0a52c;--green:#1f7a4d;--teal:#16847f;--shadow:0 18px 40px -18px #2b242038}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 12% 8%,#c6282817,transparent 40%),radial-gradient(circle at 88% 15%,#1f7a4d14,transparent 42%),radial-gradient(circle at 50% 95%,#e0a52c19,transparent 45%)}
button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1050px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}.brand{font-family:Georgia,serif;font-size:28px;color:var(--red)}.brand small{font:12px Arial;color:var(--dim);margin-left:10px}.tabs{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:999px}.tab{border:0;background:none;padding:9px 16px;border-radius:999px;color:var(--dim);font-weight:bold}.tab.active{background:var(--red);color:white}.view{display:none}.view.active{display:block}.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 25px -22px #000}.title{font:22px Georgia,serif;margin:0 0 5px}.hint{color:var(--dim);font-size:13px;margin:0 0 16px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;color:var(--text)}input:focus,select:focus{border-color:var(--teal)}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--red);color:white;font-weight:bold}.btn.gold{background:var(--gold);color:#2b1c00}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}.cards{display:flex;flex-direction:column;gap:8px}.cardrow{display:grid;grid-template-columns:54px 1fr 1fr auto;gap:12px;align-items:center;background:#e8a9a5;border:1px solid #d47f78;border-radius:12px;padding:7px 10px}.cardrow img,.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#d99490}.ko{font-family:Georgia,serif;font-weight:bold}.fr{font-size:13px;color:#5a3230}.reviewCard{max-width:650px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow);text-align:center}.image{width:min(360px,100%);aspect-ratio:4/3;margin:0 auto 18px;border-radius:14px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--dim)}.image img{width:100%;height:100%;object-fit:cover}.french{font:30px Georgia,serif;margin:14px}.answer{max-width:470px;margin:auto;display:flex;gap:8px}.answer input{flex:1;font-family:Georgia,serif;font-size:17px}.reveal{display:none;margin:18px auto 0;padding:15px;border-radius:14px;background:var(--surface2);max-width:470px}.reveal.show{display:block}.hangul{font:32px Georgia,serif;font-weight:bold}.correct{color:var(--green);font-weight:bold}.wrong{color:var(--red);font-weight:bold}.progress{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--gold)}.score{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;margin-bottom:8px}.hidden{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:11px 16px;border-radius:999px;display:none;z-index:10}.toast.show{display:block}@media(max-width:650px){.cardrow{grid-template-columns:52px 1fr auto}.cardrow .fr{grid-column:2}.answer{flex-direction:column}.brand small{display:block;margin:5px 0 0}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div class="brand">SeoulCards <small>한국어 · lexique & flashcards</small></div>
<nav class="tabs"><button class="tab active" data-view="manage">Gestion</button><button class="tab" data-view="review">Révision</button></nav>
</header>

<section id="manage" class="view active">
<div class="panel">
<h2 class="title">📂 Catégories</h2><p class="hint">Crée tes propres catégories.</p>
<div class="row"><div class="field"><label>Nom</label><input id="catName" placeholder="Ex. Nourriture"></div><button class="btn gold" id="addCat">Ajouter</button></div>
<div id="chips" class="chips"></div>
</div>

<div class="panel">
<h2 class="title">🃏 Ajouter une carte</h2><p class="hint">Ajoute le coréen, le français et éventuellement une image.</p>
<div class="row">
<div class="field"><label>Catégorie</label><select id="catSelect"></select></div>
<div class="field"><label>Coréen</label><input id="ko" placeholder="사과"></div>
<div class="field"><label>Français</label><input id="fr" placeholder="pomme"></div>
</div>
<div class="row" style="margin-top:10px">
<div class="field"><label>Image</label><input id="image" type="file" accept="image/*"></div>
<button class="btn" id="addCard">Ajouter la carte</button>
</div>
</div>

<div class="panel">
<h2 class="title">📚 Mes cartes</h2>
<div class="row"><div class="field"><label>Filtrer</label><select id="filter"><option value="">Toutes les catégories</option></select></div></div>
<div id="cards" class="cards" style="margin-top:14px"></div>
</div>
</section>

<section id="review" class="view">
<div class="panel">
<h2 class="title">🌸 Révision</h2><p class="hint">Choisis une catégorie ou révise tout le lexique.</p>
<div class="row"><div class="field"><label>Lexique</label><select id="reviewCat"></select></div><button class="btn" id="start">Commencer</button></div>
</div>
<div id="stage" class="hidden">
<div class="score"><span id="count">Carte 1 / 1</span><span id="score">✔ 0 · ✘ 0</span></div>
<div class="progress"><div id="bar" style="width:0%"></div></div>
<div id="reviewCard" class="reviewCard"></div>
</div>
</section>
</div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL="REMPLACE_MOI_URL";
const SUPABASE_ANON_KEY="REMPLACE_MOI_ANON_KEY";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let cats=[],cards=[],deck=[],index=0,score={ok:0,no:0},answered=false;

const $=id=>document.getElementById(id);
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function norm(s){return (s||"").trim().replace(/\s+/g," ").toLowerCase()}
function catName(id){return cats.find(c=>c.id===id)?.name||"Sans catégorie"}

async function load(){
 const [a,b]=await Promise.all([sb.from("categories").select("*").order("created_at"),sb.from("flashcards").select("*").order("created_at",{ascending:false})]);
 if(a.error||b.error){console.error(a.error,b.error);toast("Vérifie la connexion Supabase.");return}
 cats=a.data||[];cards=b.data||[];render();
}
function render(){
 $("chips").innerHTML=cats.map(c=>`<span class="chip">${esc(c.icon||"📚")} ${esc(c.name)}</span>`).join("")||"<span style='color:#6f6248'>Aucune catégorie.</span>";
 const opts=cats.map(c=>`<option value="${c.id}">${esc(c.icon||"📚")} ${esc(c.name)}</option>`).join("");
 $("catSelect").innerHTML=opts||"<option value=''>Crée d'abord une catégorie</option>";
 $("filter").innerHTML="<option value=''>Toutes les catégories</option>"+opts;
 $("reviewCat").innerHTML="<option value=''>🌐 Lexique global</option>"+opts;
 const f=$("filter").value;
 $("cards").innerHTML=(f?cards.filter(c=>c.category_id===f):cards).map(c=>`<div class="cardrow"><div>${c.image_url?`<img src="${esc(c.image_url)}">`:`<div class="thumb"></div>`}</div><div><div class="ko">${esc(c.korean)}</div><div style="font-size:11px;color:#6f6248">${esc(catName(c.category_id))}</div></div><div class="fr">${esc(c.french)}</div><button class="btn secondary" onclick="delCard('${c.id}')">Supprimer</button></div>`).join("")||"<div style='text-align:center;color:#6f6248;padding:18px'>Aucune carte.</div>";
}
$("addCat").onclick=async()=>{const name=$("catName").value.trim();if(!name)return toast("Donne un nom.");const {error}=await sb.from("categories").insert({name});if(error)return toast("Erreur lors de la création.");$("catName").value="";await load();toast("Catégorie ajoutée 🌸")};
$("filter").onchange=render;
$("addCard").onclick=async()=>{
 const category_id=$("catSelect").value,korean=$("ko").value.trim(),french=$("fr").value.trim(),file=$("image").files[0];
 if(!category_id||!korean||!french)return toast("Catégorie, coréen et français sont obligatoires.");
 let image_url=null;
 if(file){
  const path=`${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  const up=await sb.storage.from("vocabulary-images").upload(path,file,{upsert:false});
  if(up.error)return toast("Erreur lors de l'envoi de l'image.");
  image_url=sb.storage.from("vocabulary-images").getPublicUrl(path).data.publicUrl;
 }
 const {error}=await sb.from("flashcards").insert({category_id,korean,french,image_url});
 if(error)return toast("Erreur lors de la création de la carte.");
 $("ko").value="";$("fr").value="";$("image").value="";await load();toast("Carte ajoutée ✨");
};
async function delCard(id){if(!confirm("Supprimer cette carte ?"))return;const {error}=await sb.from("flashcards").delete().eq("id",id);if(error)return toast("Impossible de supprimer.");await load();toast("Carte supprimée.");}
window.delCard=delCard;

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.view).classList.add("active")});

$("start").onclick=()=>{
 const cid=$("reviewCat").value;const source=cid?cards.filter(c=>c.category_id===cid):cards;
 if(!source.length)return toast("Aucune carte dans ce lexique.");
 deck=shuffle(source).slice(0,15);index=0;score={ok:0,no:0};$("stage").classList.remove("hidden");showCard();
};
function showCard(){
 answered=false;const c=deck[index];$("count").textContent=`Carte ${index+1} / ${deck.length}`;$("score").textContent=`✔ ${score.ok} · ✘ ${score.no}`;$("bar").style.width=`${index/deck.length*100}%`;
 $("reviewCard").innerHTML=`<div style="font-size:11px;color:#16847f;font-weight:bold;text-transform:uppercase">${esc(catName(c.category_id))}</div><div class="image">${c.image_url?`<img src="${esc(c.image_url)}" alt="">`:"Pas d'image"}</div><div class="french">${esc(c.french)}</div><div class="answer"><input id="answer" placeholder="Écris en 한글…" autocomplete="off"><button class="btn gold" id="reveal">Voir la réponse</button></div><div id="revealBox" class="reveal"><div class="hangul">${esc(c.korean)}</div><div id="verdict"></div></div>`;
 $("reveal").onclick=reveal;$("answer").onkeydown=e=>{if(e.key==="Enter")reveal()};$("answer").focus();
}
async function reveal(){
 if(answered)return;answered=true;const c=deck[index],val=$("answer").value,is=norm(val)!==""&&norm(val)===norm(c.korean);if(is)score.ok++;else score.no++;
 $("verdict").className=is?"correct":"wrong";$("verdict").textContent=is?"Correct ✔":"À revoir ✘";$("revealBox").classList.add("show");$("answer").disabled=true;$("reveal").style.display="none";$("score").textContent=`✔ ${score.ok} · ✘ ${score.no}`;
 await sb.from("review_history").insert({flashcard_id:c.id,success:is,user_answer:val});
 const next=document.createElement("button");next.className="btn";next.textContent=index+1<deck.length?"Carte suivante →":"Terminer";next.style.marginTop="16px";next.onclick=()=>{index++;if(index>=deck.length){$("bar").style.width="100%";$("reviewCard").innerHTML=`<div style="font-size:42px">수고했어요! 🌸</div><p>Session terminée.</p><p><b>${score.ok}</b> correctes · <b>${score.no}</b> fautes</p>`}else showCard()};$("revealBox").appendChild(next);
}
load();
</script>
</body>
</html>
