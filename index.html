<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HanCards</title>
<link rel="icon" type="image/png" href="./favicon.png">
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@font-face {
  font-family:"Rastanty Cortez";
  src:url("./fonts/Rastanty-Cortez.otf") format("woff2");
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}

:root{
  --bg:#f7f1e0;
  --surface:#fffdf7;
  --surface2:#f2e7c9;
  --line:#e2cf9c;
  --text:#2b2420;
  --dim:#6f6248;

  --red:#c62828;
  --gold:#e0a52c;
  --green:#1f7a4d;
  --teal:#16847f;

  --shadow:0 18px 40px -18px #2b242038;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;

  background-image:
    radial-gradient(
      circle at 12% 8%,
      #c6282817,
      transparent 40%
    ),
    radial-gradient(
      circle at 88% 15%,
      #1f7a4d14,
      transparent 42%
    ),
    radial-gradient(
      circle at 50% 95%,
      #e0a52c19,
      transparent 45%
    );

  transition:
    background .35s ease,
    color .35s ease;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.shell{
  max-width:1050px;
  margin:auto;
  padding:28px 18px 70px;
}

/* =========================
   HEADER
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;

  border-bottom:1px solid var(--line);

  padding-bottom:20px;
  margin-bottom:22px;

  transition:border-color .35s ease;
}

.brand{
  font-family:Georgia,serif;
  font-size:28px;
  color:var(--red);

  transition:color .35s ease;
}

.brand small{
  font:12px Arial;
  color:var(--dim);
  margin-left:10px;
}

.tabs{
  display:flex;
  gap:5px;

  background:var(--surface);
  border:1px solid var(--line);

  padding:4px;

  border-radius:999px;
}

.tab{
  border:0;
  background:none;

  padding:9px 16px;

  border-radius:999px;

  color:var(--dim);
  font-weight:bold;

  transition:
    background .25s ease,
    color .25s ease;
}

.tab.active{
  background:var(--red);
  color:white;
}

/* =========================
   VIEWS
========================= */

.view{
  display:none;
}

.view.active{
  display:block;
}

/* =========================
   PANELS
========================= */

.panel{
  background:var(--surface);

  border:1px solid var(--line);
  border-radius:20px;

  padding:20px;
  margin-bottom:18px;

  box-shadow:0 8px 25px -22px #000;

  transition:
    background .35s ease,
    border-color .35s ease,
    color .35s ease;
}

.title{
  font-family:"Rastanty Cortez",cursive;
  font-size:50px;
  font-weight:normal;
  margin:0 0 5px;
}

/* Couleur des titres uniquement dans Gestion */
#manage .title{
  color:#b33a3a;
}

.hint{
  color:var(--dim);
  font-size:13px;
  margin:0 0 16px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;

  flex:1;
  min-width:150px;
}

.field label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--dim);
}

input,
select{
  background:var(--bg);

  border:1px solid var(--line);
  border-radius:10px;

  padding:11px 12px;

  outline:none;

  color:var(--text);

  transition:
    background .3s ease,
    border-color .3s ease,
    color .3s ease;
}

input:focus,
select:focus{
  border-color:var(--teal);
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:10px;

  padding:11px 16px;

  background:var(--red);
  color:white;

  font-weight:bold;

  transition:
    transform .15s ease,
    filter .15s ease,
    background .25s ease;
}

.btn:hover{
  filter:brightness(.96);
}

.btn:active{
  transform:scale(.98);
}

.btn.gold{
  background:var(--gold);
  color:#2b1c00;
}

.btn.secondary{
  background:var(--surface2);
  color:var(--text);

  border:1px solid var(--line);
}

/* =========================
   CATEGORIES
========================= */

.chips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;

  background:var(--surface2);

  border:1px solid var(--line);

  border-radius:999px;

  padding:8px 12px;

  font-size:13px;
}

.chipDelete{
  border:0;
  background:transparent;
  color:inherit;
  font-size:16px;
  line-height:1;
  cursor:pointer;
  padding:0 2px;
  opacity:.65;
}

.chipDelete:hover{
  opacity:1;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  align-items:start;
}

.cardrow{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:7px;
  min-height:180px;
  padding:12px 10px 14px;
  background:#e8a9a5;
  border:1px solid #d47f78;
  border-radius:14px;
  cursor:pointer;
  overflow:visible;
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.cardrow:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px -18px #2b2420;
}

.cardrow.selected{
  border-color:var(--red);
  box-shadow:0 10px 25px -18px #2b2420;
}

.cardVisual{
  width:100%;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cardrow img,
.cardrow .thumb{
  width:140px;
  height:140px;
  border-radius:12px;
  object-fit:cover;
  background:#d99490;
}

.cardrow .thumb{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  color:#7a403c;
}

.cardWords{
  width:100%;
  text-align:center;
  line-height:1.2;
}

.ko{
  font-family:Georgia,serif;
  font-weight:bold;
  font-size:20px;
}

.fr{
  font-size:13px;
  color:#5a3230;
  margin-top:3px;
}

.cardActions{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  flex-direction:row;
  gap:8px;
  padding:10px;
  background:rgba(232,169,165,.92);
  border-radius:14px;
  opacity:0;
  visibility:hidden;
  z-index:1000;

  transition:
    opacity .18s ease,
    visibility .18s ease;
}

.cardrow.selected .cardActions{
  opacity:1;
  visibility:visible;
}

.cardrow.selected .cardActions .iconBtn{
  pointer-events:auto;
}

.iconBtn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:8px;
  width:34px;
  height:34px;
  padding:0;
  font-size:16px;
  transition:
    background .2s ease,
    color .2s ease,
    transform .15s ease;
}

.iconBtn:hover{
  background:var(--surface2);
}

.iconBtn:active{
  transform:scale(.95);
}

.iconBtn.delete{
  color:var(--red);
}

.iconBtn.record{
  color:var(--green);
}

.iconBtn.recording{
  color:white;
  background:var(--red);
  border-color:var(--red);
  animation:recordingPulse 1s infinite;
}

@media(max-width:900px){

  .cards{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

}

@media(max-width:650px){

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .cardrow{
    min-height:165px;
  }

  .cardrow img,
  .cardrow .thumb{
    width:96px;
    height:96px;
  }

}

@keyframes recordingPulse{

  0%,
  100%{
    opacity:1;
  }

  50%{
    opacity:.5;
  }

}

/* =========================
   EDIT BOX
========================= */

.editBox{
  grid-column:1/-1;

  position:relative;
  z-index:1100;

  background:var(--surface);

  border:1px solid var(--line);

  border-radius:12px;

  padding:14px;

  margin-top:4px;

  width:100%;
}

.editActions{
  display:flex;
  gap:8px;

  justify-content:flex-end;

  margin-top:12px;
}

.audioRow{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
}

.audioRow audio{
  max-width:240px;
  height:34px;
}

.recordStatus{
  font-size:12px;
  color:var(--dim);
}

/* =========================
   VERBS
========================= */

.verbFormGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:20px;
}

.verbTense{
  margin:22px 0 10px;
  font-size:17px;
}

.verbItem{
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
}

.verbItemLabel{
  font-size:11px;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:.04em;
}

.verbItemValue{
  font-family:Georgia,serif;
  font-size:20px;
  font-weight:bold;
  margin-top:4px;
}

.verbListCard{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
}

.verbListHeader{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.verbListInfinitive{
  font-family:Georgia,serif;
  font-size:22px;
  font-weight:bold;
}

.verbListDescription{
  color:var(--dim);
  font-size:13px;
  margin-top:4px;
}

/* =========================
   VERBS THEME
========================= */

body.verbs-theme{
  --bg:#eaf6ff; --surface:#f8fcff; --surface2:#d9efff;
  --line:#a8d4ee; --text:#17384d; --dim:#58758a;
  --red:#3b9bd6; --gold:#e7b84b; --green:#2f8f67; --teal:#318fbd;
  background:#eaf6ff;
  background-image:radial-gradient(circle at 10% 8%,#3b9bd622,transparent 38%),radial-gradient(circle at 90% 12%,#6fc3ed22,transparent 40%),radial-gradient(circle at 50% 95%,#a8dcfa25,transparent 45%);
}
body.verbs-theme .brand{color:#318fbd;}
body.verbs-theme .top{border-color:#a8d4ee;}
body.verbs-theme .tabs{background:#f8fcff;border-color:#a8d4ee;}
body.verbs-theme .tab{color:#58758a;}
body.verbs-theme .tab.active{background:#5bb3e8;color:white;}
body.verbs-theme .panel{background:#f8fcff;border-color:#a8d4ee;}
body.verbs-theme .title{color:#287da8;}
body.verbs-theme .hint{color:#58758a;}
body.verbs-theme input,body.verbs-theme select{background:#eaf6ff;border-color:#a8d4ee;color:#17384d;}
body.verbs-theme input:focus,body.verbs-theme select:focus{border-color:#318fbd;}
body.verbs-theme .btn{background:#3b9bd6;color:white;}
body.verbs-theme .btn.gold{background:#e7b84b;color:#17384d;}
body.verbs-theme .btn.secondary{background:#d9efff;color:#17384d;border-color:#a8d4ee;}
body.verbs-theme .verbItem{background:#d9efff;border-color:#a8d4ee;}
body.verbs-theme .verbItemLabel{color:#58758a;}
body.verbs-theme .verbListCard{background:#f8fcff;border-color:#a8d4ee;}
body.verbs-theme .verbListDescription{color:#58758a;}

/* =========================
   REVIEW THEME
========================= */

body.review-theme{

  --bg:#e7f5ec;
  --surface:#f9fffb;
  --surface2:#d7eee0;

  --line:#a7d1b5;

  --text:#183c29;
  --dim:#557564;

  --red:#197044;
  --gold:#d5a52a;

  --green:#197044;
  --teal:#197044;

  background:#e7f5ec;

  background-image:
    radial-gradient(
      circle at 10% 8%,
      #19704422,
      transparent 38%
    ),
    radial-gradient(
      circle at 90% 12%,
      #16847f18,
      transparent 40%
    ),
    radial-gradient(
      circle at 50% 95%,
      #65b98125,
      transparent 45%
    );
}

body.review-theme .brand{
  color:#197044;
}

body.review-theme .top{
  border-color:#a7d1b5;
}

body.review-theme .tabs{
  background:#f9fffb;
  border-color:#a7d1b5;
}

body.review-theme .tab{
  color:#557564;
}

body.review-theme .tab.active{
  background:#197044;
  color:white;
}

body.review-theme .panel{
  background:#f9fffb;
  border-color:#a7d1b5;
}

body.review-theme .title{
  color:#145c38;
}

body.review-theme .hint{
  color:#557564;
}

body.review-theme input,
body.review-theme select{
  background:#e7f5ec;
  border-color:#a7d1b5;
  color:#183c29;
}

body.review-theme input:focus,
body.review-theme select:focus{
  border-color:#197044;
}

body.review-theme .btn{
  background:#197044;
  color:white;
}

body.review-theme .btn.gold{
  background:#d5a52a;
  color:#183c29;
}

body.review-theme .btn.secondary{
  background:#d7eee0;
  color:#183c29;
  border-color:#a7d1b5;
}

/* =========================
   REVIEW
========================= */

.reviewCard{
  max-width:650px;

  margin:20px auto;

  background:var(--surface);

  border:1px solid var(--line);

  border-radius:22px;

  padding:28px;

  box-shadow:var(--shadow);

  text-align:center;

  transition:
    background .35s ease,
    border-color .35s ease;
}

body.review-theme .reviewCard{
  background:#f9fffb;
  border-color:#a7d1b5;

  box-shadow:
    0 18px 40px -18px #19704438;
}

.image{
  width:min(360px,100%);

  aspect-ratio:4/3;

  margin:0 auto 18px;

  border-radius:14px;

  overflow:hidden;

  background:var(--surface2);

  display:flex;

  align-items:center;
  justify-content:center;

  color:var(--dim);
}

body.review-theme .image{
  background:#d7eee0;
  color:#557564;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.french{
  font:30px Georgia,serif;
  margin:14px;
}

body.review-theme .french{
  color:#145c38;
}

.answer{
  max-width:470px;

  margin:auto;

  display:flex;

  gap:8px;
}

.answer input{
  flex:1;

  font-family:Georgia,serif;

  font-size:17px;
}

.reveal{
  display:none;

  margin:18px auto 0;

  padding:15px;

  border-radius:14px;

  background:var(--surface2);

  max-width:470px;
}

.reveal.show{
  display:block;
}

body.review-theme .reveal{
  background:#d7eee0;
}

.hangul{
  font:32px Georgia,serif;
  font-weight:bold;
}

body.review-theme .hangul{
  color:#145c38;
}

.correct{
  color:var(--green);
  font-weight:bold;
}

.wrong{
  color:var(--red);
  font-weight:bold;
}

body.review-theme .correct{
  color:#197044;
}

body.review-theme .wrong{
  color:#b52d2d;
}

.reviewAudio{
  display:flex;
  justify-content:center;
  margin:5px 0 16px;
}

.audioBtn{
  border:0;

  background:#197044;

  color:white;

  border-radius:999px;

  padding:10px 18px;

  font-weight:bold;

  box-shadow:
    0 5px 15px -8px #197044;

  transition:
    background .2s ease,
    transform .15s ease;
}

.audioBtn:hover{
  background:#145c38;
}

.audioBtn:active{
  transform:scale(.97);
}

.noAudio{
  color:#557564;
  font-size:12px;
  margin:8px 0 16px;
}

.verbReviewBadge{
  display:inline-block;

  background:var(--surface2);

  border:1px solid var(--line);

  border-radius:999px;

  padding:7px 14px;

  margin-bottom:15px;

  font-size:13px;

  color:var(--dim);
}

.verbReviewDescription{
  color:var(--dim);
  font-size:14px;
  max-width:470px;
  margin:-5px auto 15px;
}

/* =========================
   PROGRESS / SCORE
========================= */

.progress{
  height:5px;

  background:var(--surface2);

  border-radius:99px;

  overflow:hidden;
}

body.review-theme .progress{
  background:#c7e4d0;
}

.progress>div{
  height:100%;

  background:var(--gold);

  transition:
    width .3s ease;
}

body.review-theme .progress>div{
  background:#197044;
}

.score{
  display:flex;

  justify-content:space-between;

  color:var(--dim);

  font-size:13px;

  margin-bottom:8px;
}

/* =========================
   UTILITIES
========================= */

.hidden{
  display:none;
}

.toast{
  position:fixed;

  bottom:22px;
  left:50%;

  transform:translateX(-50%);

  background:var(--text);

  color:white;

  padding:11px 16px;

  border-radius:999px;

  display:none;

  z-index:9999;

  white-space:nowrap;

  max-width:calc(100vw - 30px);

  overflow:hidden;

  text-overflow:ellipsis;
}

.toast.show{
  display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .answer{
    flex-direction:column;
  }

  .brand small{
    display:block;
    margin:5px 0 0;
  }

  .top{
    align-items:flex-start;
  }

  .reviewCard{
    padding:20px;
  }

  .french{
    font-size:26px;
  }

  .verbFormGrid{
    grid-template-columns:1fr;
  }

  .tabs{
    width:100%;
    justify-content:center;
  }

  .tab{
    padding:9px 11px;
  }

}

</style>
</head>

<body>

<div class="shell">

<header class="top">

  <div class="brand">
    HanCards
    <small>한국어</small>
  </div>

  <nav class="tabs">

    <button
      class="tab active"
      data-view="manage">
      Gestion
    </button>

    <button
      class="tab"
      data-view="verbs">
      Verbes
    </button>

    <button
      class="tab"
      data-view="review">
      Révision
    </button>

  </nav>

</header>


<!-- =====================================================
     GESTION
===================================================== -->

<section id="manage" class="view active">

  <div class="panel">

    <h2 class="title">
      Catégories
    </h2>

    <div class="row">

      <div class="field">

        <label>
          Nom
        </label>

        <input
          id="catName"
          placeholder="Ex. Nourriture">

      </div>

      <button
        class="btn gold"
        id="addCat">

        Ajouter

      </button>

    </div>

    <div
      id="chips"
      class="chips">
    </div>

  </div>


  <div class="panel">

    <h2 class="title">
      Ajouter une carte
    </h2>

    <div class="row">

      <div class="field">

        <label>
          Catégorie
        </label>

        <select id="catSelect"></select>

      </div>

      <div class="field">

        <label>
          Coréen
        </label>

        <input
          id="ko"
          placeholder="사과">

      </div>

      <div class="field">

        <label>
          Français
        </label>

        <input
          id="fr"
          placeholder="pomme">

      </div>

    </div>


    <div
      class="row"
      style="margin-top:10px">

      <div class="field">

        <label>
          Image
        </label>

        <input
          id="image"
          type="file"
          accept="image/*">

      </div>

      <div class="field">

        <label>
          Audio
        </label>

        <div
          style="
            display:flex;
            align-items:center;
            gap:8px;
            width:100%;
          ">

          <input
            id="audio"
            type="file"
            accept="audio/*"
            style="
              flex:1;
              min-width:0;
            ">

          <button
            class="btn secondary"
            id="recordCreateAudio"
            type="button">

            🎙️ Enregistrer

          </button>

        </div>

        <div
          id="createAudioStatus"
          class="recordStatus"
          style="margin-top:5px;">
        </div>

      </div>

      <button
        class="btn"
        id="addCard">

        Ajouter la carte

      </button>

    </div>


    <div
      style="
        margin-top:8px;
        font-size:12px;
        color:var(--dim);
      ">

      Après création, tu peux également enregistrer
      directement ta propre prononciation avec le microphone.

    </div>

  </div>


  <div class="panel">

    <h2 class="title">
      Mes cartes
    </h2>

    <div class="row">

      <div class="field">

        <label>
          Filtrer
        </label>

        <select id="filter">

          <option value="">
            Toutes les catégories

async function uploadFile(
  bucket,
  file
){

  if(!file) return null;


  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  const path =
    `${crypto.randomUUID()}-${safeName}`;


  const upload =
    await sb
      .storage
      .from(bucket)
      .upload(
        path,
        file,
        {
          upsert:false
        }
      );


  if(upload.error){

    throw upload.error;

  }


  return sb
    .storage
    .from(bucket)
    .getPublicUrl(path)
    .data
    .publicUrl;

}

/* =====================================================

===================================================== */

async function startCreateRecording(){

  const button =
    $("recordCreateAudio");

  const status =
    $("createAudioStatus");


  if(
    createRecorder &&
    createRecorder.state ===
    "recording"
  ){

    createRecorder.stop();

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    return toast(
      "Ton navigateur ne permet pas l'enregistrement audio."
    );

  }


  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });


    createRecordedChunks = [];


    let mimeType = "";


    if(
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ){

      mimeType =
        "audio/webm;codecs=opus";

    }

    else if(
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ){

      mimeType =
        "audio/webm";

    }

    else if(
      MediaRecorder.isTypeSupported(
        "audio/mp4"
      )
    ){

      mimeType =
        "audio/mp4";

    }


    createRecorder =
      mimeType

        ?

      new MediaRecorder(
        stream,
        {
          mimeType
        }
      )

        :

      new MediaRecorder(
        stream
      );


    button.textContent =
      "⏹️ Arrêter";

    button.classList.add(
      "recording"
    );


    status.textContent =
      "🔴 Enregistrement…";


    toast(
      "🎙️ Enregistrement en cours…"
    );


    createRecorder.ondataavailable =
      event => {

        if(event.data.size){

          createRecordedChunks.push(
            event.data
          );

        }

      };


    createRecorder.onstop =
      () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        if(
          !createRecordedChunks.length
        ){

          status.textContent = "";

          createRecorder = null;

          return;

        }


        const finalType =
          createRecorder.mimeType ||
          mimeType ||
          "audio/webm";


        const extension =
          finalType.includes("mp4")
            ? "mp4"
            : "webm";


        const blob =
          new Blob(
            createRecordedChunks,
            {
              type:finalType
            }
          );


        createAudioFile =
          new File(
            [blob],
            `recording-${Date.now()}.${extension}`,
            {
              type:finalType
            }
          );


        $("audio").value = "";


        button.textContent =
          "🎙️ Refaire l'enregistrement";


        button.classList.remove(
          "recording"
        );


        status.textContent =
          "✅ Audio enregistré";


        toast(
          "🎉 Audio prêt pour la création de la carte."
        );


        createRecordedChunks = [];

        createRecorder = null;

      };


    createRecorder.start();


  }catch(error){

    console.error(error);

    button.textContent =
      "🎙️ Enregistrer ma voix";

    button.classList.remove(
      "recording"
    );

    status.textContent = "";


    toast(
      "Impossible d'accéder au microphone. Autorise le micro dans ton navigateur."
    );

  }

}

async function deleteCategory(

  event
){

  if(event){

    event.stopPropagation();

  const category =
    cats.find(
      item =>
        item.id === id
    );


  if(!category) return;


  const linkedCards =
    cards.filter(
      card =>
        card.category_id === id
    );


  let message =
    `Supprimer la catégorie « ${category.name} » ?`;


  if(linkedCards.length){

    message +=
      `\n\nCette catégorie contient ${linkedCards.length} carte(s).\n` +

  if(!confirm(message)) return;

      const {
        error:cardsError
      } =
        await sb
          .from("flashcards")
          .delete()
          .eq(
            "category_id",

    }


    const {error} =
      await sb
        .from("categories")
        .delete()
        .eq(
          "id",
          id
        );


    if(error){

      throw error;

    }


    await load();


    toast(
      "Catégorie supprimée."
    );


  }catch(error){

    toast(
      "Impossible de supprimer la catégorie."

/* =====================================================

===================================================== */

async function startVerbRecording(){

  const button =
    $("recordVerbAudio");

  const status =
    $("verbAudioStatus");


  if(
    verbRecorder &&
    verbRecorder.state ===
    "recording"
  ){

    verbRecorder.stop();

    return;

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    return toast(
      "Ton navigateur ne permet pas l'enregistrement audio."
    );

  }


  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });


    verbRecordedChunks = [];


    let mimeType = "";


    if(
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ){

      mimeType =
        "audio/webm;codecs=opus";

    }

    else if(
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ){

      mimeType =
        "audio/webm";

    }

    else if(
      MediaRecorder.isTypeSupported(
        "audio/mp4"
      )
    ){

      mimeType =
        "audio/mp4";

    }


    verbRecorder =
      mimeType

        ?

      new MediaRecorder(
        stream,
        {
          mimeType
        }
      )

        :

      new MediaRecorder(
        stream
      );


    button.textContent =
      "⏹️ Arrêter";


    button.classList.add(
      "recording"
    );


    status.textContent =
      "🔴 Enregistrement…";


    toast(
      "🎙️ Enregistrement en cours…"
    );


    verbRecorder.ondataavailable =
      event => {

        if(event.data.size){

          verbRecordedChunks.push(
            event.data
          );

        }

      };


    verbRecorder.onstop =
      () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        if(
          !verbRecordedChunks.length
        ){

          status.textContent = "";

          verbRecorder = null;

          return;

        }


        const finalType =
          verbRecorder.mimeType ||
          mimeType ||
          "audio/webm";


        const extension =
          finalType.includes("mp4")
            ? "mp4"
            : "webm";


        const blob =
          new Blob(
            verbRecordedChunks,
            {
              type:finalType
            }
          );


        verbAudioFile =
          new File(
            [blob],
            `verb-${Date.now()}.${extension}`,
            {
              type:finalType
            }
          );


        $("verbAudio").value = "";


        button.textContent =
          "🎙️ Refaire";


        button.classList.remove(
          "recording"
        );


        status.textContent =
          "✅ Audio enregistré";


        verbRecordedChunks = [];

        verbRecorder = null;


        toast(
          "🎉 Audio prêt."
        );

      };


    verbRecorder.start();


  }catch(error){

    console.error(error);

    toast(
      "Impossible d'accéder au microphone."
    );

  }

}

$("start").onclick =

      $("reviewCat").value;


    /*
      =========================

      =========================
    */

    if(
      categoryId ===
      "__VERBS__"
    ){

      if(!verbs.length){

        return toast(
          "Aucun verbe dans le lexique."
        );

      }


      /*
        Chaque verbe n'apparaît
        qu'une seule fois.

        Une des 6 formes est
        choisie aléatoirement.
      */

      deck =
        shuffle(verbs)
          .slice(0,15)
          .map(verb => {

            const forms = [

              {
                tense:"Présent",
                register:"Courant",
                korean:
                  verb.present_casual
              },

              {
                tense:"Présent",
                register:"Formel",
                korean:
                  verb.present_formal
              },

              {
                tense:"Passé",
                register:"Courant",
                korean:
                  verb.past_casual
              },

              {
                tense:"Passé",
                register:"Formel",
                korean:
                  verb.past_formal
              },

              {
                tense:"Futur",
                register:"Courant",
                korean:
                  verb.future_casual
              },

              {
                tense:"Futur",
                register:"Formel",
                korean:
                  verb.future_formal
              }

            ].filter(
              form =>
                form.korean
            );


            const chosen =
              forms[
                Math.floor(
                  Math.random() *
                  forms.length
                )
              ];


            return {

              ...verb,

              reviewType:
                "verb",

              tense:
                chosen.tense,

              register:
                chosen.register,

              korean:
                chosen.korean

            };

          });

        "verbs";

    }


    /*
      =========================
      CARTES CLASSIQUES
      =========================
    */

    else{

      const source =
        categoryId

          ?

        cards.filter(
          card =>
            card.category_id ===
            categoryId
        )

          :

        cards;


      if(!source.length){

async function reveal(){

  if(answered){

    return;

  }


  answered = true;


  const card =
    deck[index];


  const value =
    $("answer")
      .value;


  const isCorrect =
    norm(value) !== "" &&
    norm(value) ===
    norm(card.korean);


  if(isCorrect){

    score.ok++;

  }else{

    score.no++;

  }


  $("verdict").className =
    isCorrect
      ? "correct"
      : "wrong";


  $("verdict").textContent =
    isCorrect
      ? "Correct ✔"
      : "À revoir ✘";


  $("revealBox")
    .classList
    .add("show");


  $("answer").disabled =
    true;


  $("reveal").style.display =
    "none";


  $("score").textContent =
    `✔ ${score.ok} · ✘ ${score.no}`;


  /*
    Historique uniquement
    pour les cartes classiques.
  */

  if(
    reviewType ===
    "cards"
  ){

    const historyResult =
      await sb
        .from("review_history")
        .insert({

          flashcard_id:
            card.id,

          success:
            isCorrect,

          user_answer:
            value

        });


    if(historyResult.error){

      console.error(
        historyResult.error
      );

    }

  }


  const nextButton =
    document.createElement(
      "button"
    );


  nextButton.className =
    "btn";


  nextButton.textContent =
    index + 1 <
    deck.length

      ?

    "Carte suivante →"

      :

    "Terminer";


  nextButton.style.marginTop =
    "16px";


  nextButton.onclick =
    () => {

      index++;


      if(
        index >=
        deck.length
      ){

        $("bar").style.width =
          "100%";


        $("reviewCard").innerHTML = `

          <div
            style="
              font-size:42px;
              color:#197044;
            ">

            수고했어요! 🌿

          </div>


          <p>
            Session terminée.
          </p>


          <p>

            <b>
              ${score.ok}
            </b>

            correctes

            ·

            <b>
              ${score.no}
            </b>

            fautes

          </p>

        `;

      }

      else{

        showCard();

      }

    };


  $("revealBox")
    .appendChild(
      nextButton
    );

}


/* =====================================================
   INITIALISATION
===================================================== */

load();

</script>
